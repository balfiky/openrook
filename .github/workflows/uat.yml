name: UAT

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live:
        description: "Run live backend UAT. Requires configured live backend secrets."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  uat-collect-smoke:
    # The UAT suite is live-LLM by design (OpenRook has no mock backend), so it
    # cannot run end-to-end on every push. This gate verifies what CAN be
    # verified without a model: the 67-test suite still collects cleanly
    # (imports, fixtures, markers), and a fresh `openrook-web` install boots,
    # self-bootstraps its config, and serves /v1/health and the setup
    # wizard. The full suite runs in the opt-in live-uat job below or
    # locally via `make uat-comprehensive`.
    name: UAT collection + server boot smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and UAT dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,uat]"

      - name: UAT suite collects cleanly
        run: |
          python -m pytest tests/uat --collect-only -q | tee collect.log
          count=$(grep -oE '^[0-9]+ tests collected' collect.log | grep -oE '^[0-9]+' || echo 0)
          echo "collected: $count"
          if [ "$count" -lt 60 ]; then
            echo "::error::UAT collection gate expects >=60 tests, got $count"
            exit 1
          fi

      - name: Server boots and serves health + setup wizard
        run: |
          workdir=$(mktemp -d)
          cd "$workdir"
          openrook-web --host 127.0.0.1 --port 8123 >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8123/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8123/v1/health
          python -c "from pathlib import Path; import yaml; path = Path('runtime_config.yaml'); assert path.is_file(); assert yaml.safe_load(path.read_text())['llm_model'] == ''"
          status=$(curl -fsS -o /dev/null -w "%{http_code}" http://127.0.0.1:8123/)
          echo "root: $status"
          kill "$server_pid" || true
          if [ "$status" != "200" ]; then
            echo "::error::Setup wizard page returned $status"
            cat server.log
            exit 1
          fi

      - name: Setup creates a config without a selected model
        run: |
          workdir=$(mktemp -d)
          cd "$workdir"
          openrook-setup --init-only
          python -c "from pathlib import Path; import yaml; path = Path('runtime_config.yaml'); assert path.is_file(); assert yaml.safe_load(path.read_text())['llm_model'] == ''"

  live-uat:
    name: Browser/Admin UAT (live backend)
    runs-on: ubuntu-latest
    # Live UAT is intentionally opt-in: it depends on repository secrets and
    # should not fail every push when those secrets are absent. The
    # collection + boot smoke job above is the required push/PR gate.
    if: >-
      (
        (github.event_name == 'workflow_dispatch' && inputs.run_live) ||
        (vars.OPENROOK_RUN_LIVE_UAT || vars.NUR_RUN_LIVE_UAT) == '1' ||
        (vars.OPENROOK_RUN_LIVE_UAT || vars.NUR_RUN_LIVE_UAT) == 'true'
      ) &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      OPENROOK_UAT_BACKEND: ${{ vars.OPENROOK_UAT_BACKEND || vars.NUR_UAT_BACKEND }}
      OPENROOK_UAT_MODEL: ${{ vars.OPENROOK_UAT_MODEL || vars.NUR_UAT_MODEL }}
      OPENROOK_UAT_BASE_URL: ${{ vars.OPENROOK_UAT_BASE_URL || vars.NUR_UAT_BASE_URL }}
      OPENROOK_UAT_API_KEY_ENV: ${{ vars.OPENROOK_UAT_API_KEY_ENV || vars.NUR_UAT_API_KEY_ENV }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and UAT dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,uat]"
          python -m playwright install --with-deps chromium

      - name: Run live UAT without mock fallback
        run: |
          backend="${OPENROOK_UAT_BACKEND:-openai_compatible}"
          key_env="${OPENROOK_UAT_API_KEY_ENV:-}"
          if [ -z "$key_env" ]; then
            key_env="LLM_API_KEY"
          fi
          if [ "$backend" != "codex" ] && [ -z "${!key_env}" ]; then
            echo "::error::Live UAT requires \$$key_env. Configure repository secrets/variables or run trusted PRs only."
            exit 1
          fi
          python -m nur_tools.uat \
            --live \
            --backend "$backend" \
            --model "${OPENROOK_UAT_MODEL:-}" \
            --base-url "${OPENROOK_UAT_BASE_URL:-}" \
            --api-key-env "$key_env" \
            --artifacts reports/uat/live

      - name: Upload live UAT artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrook-uat-live
          path: reports/uat/live
