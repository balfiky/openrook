<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="824" viewBox="0 0 1280 824" role="img" aria-labelledby="memory-persistence-model-light-title memory-persistence-model-light-desc">
<title id="memory-persistence-model-light-title">A user reset has a precise boundary</title>
<desc id="memory-persistence-model-light-desc">Ordinary-mode deletion removes the per-user directory, while shared identity and research databases and global configuration are retained; research-mode DELETE and mutating admin requests return HTTP 409.</desc>
