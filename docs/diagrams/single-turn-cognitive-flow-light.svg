<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="848" viewBox="0 0 1400 848" role="img" aria-labelledby="single-turn-cognitive-flow-light-title single-turn-cognitive-flow-light-desc">
<title id="single-turn-cognitive-flow-light-title">A turn is more than one model call</title>
<desc id="single-turn-cognitive-flow-light-desc">Conversation-mode stages separate deterministic runtime work from possible appraisal, inner-dialogue, tool-selection, generation, self-check and regeneration model calls; end_session consolidation is a separate path with additional possible inference.</desc>
