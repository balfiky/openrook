<title id="single-turn-cognitive-flow-dark-title">A turn is more than one model call</title>
<desc id="single-turn-cognitive-flow-dark-desc">Conversation-mode stages separate deterministic runtime work from possible appraisal, inner-dialogue, tool-selection, generation, self-check and regeneration model calls; end_session consolidation is a separate path with additional possible inference.</desc>
