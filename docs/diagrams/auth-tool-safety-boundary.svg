<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="auth-and-tool-safety-boundaries-title auth-and-tool-safety-boundaries-desc"><title id="auth-and-tool-safety-boundaries-title">Auth and Tool-Safety Boundaries</title><desc id="auth-and-tool-safety-boundaries-desc">HTTP authentication and tool availability are separate controls. Disabling external tools still leaves internal skill-registry tools available.</desc><defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L9,5 L1,9 Z" fill="#57606a"/></marker></defs><rect width="100%" height="100%" fill="#fafbfc"/><text x="48" y="52" text-anchor="start" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="28" font-weight="800" fill="#1f2328">Auth and Tool-Safety Boundaries</text><text x="48" y="78" text-anchor="start" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="400" fill="#57606a">HTTP authentication and tool availability are separate controls. Disabling external tools still leaves internal skill-registry tools available.</text><rect x="40" y="120" width="600" height="476" rx="18" fill="none" stroke="#218bff" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.85"/>
<text x="56" y="142" text-anchor="start" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#0550ae">HTTP request gate</text>
<rect x="672" y="120" width="888" height="476" rx="18" fill="none" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.85"/>
<text x="688" y="142" text-anchor="start" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#a40e26">Tool selection → common executor and policy</text>
<path d="M340,252 L340,292" fill="none" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrowhead)"/>
<path d="M1108,252 L1108,292" fill="none" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrowhead)"/>
<path d="M1108,392 L1108.0,412.0 Q1108,420 1100.0,420.0 L900.0,420.0 Q892,420 892.0,428.0 L892,452" fill="none" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrowhead)"/>
<path d="M1140,392 L1140.0,412.0 Q1140,420 1148.0,420.0 L1312.0,420.0 Q1320,420 1320.0,428.0 L1320,452" fill="none" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrowhead)"/>
<rect x="64" y="164" width="552" height="88" rx="10" fill="#ddf4ff" stroke="#218bff" stroke-width="1.5"/>
<text x="340.0" y="187" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#0550ae">Protected data + mutation endpoints</text>
<text x="340.0" y="209" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">/chat, /debug, /config, /admin/* APIs, /v1/*, /ws</text>
<text x="340.0" y="226" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">configured api_key: require valid Bearer token</text>
<rect x="64" y="292" width="552" height="100" rx="10" fill="#ddf4ff" stroke="#218bff" stroke-width="1.5"/>
<text x="340.0" y="315" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#0550ae">Authentication result</text>
<text x="340.0" y="337" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">No configured key: authentication is open</text>
<text x="340.0" y="354" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">Configured key: invalid / missing token → 401</text>
<text x="340.0" y="371" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">Valid token → endpoint's own authorization and checks</text>
<rect x="64" y="452" width="552" height="100" rx="10" fill="#dafbe1" stroke="#2da44e" stroke-width="1.5"/>
<text x="340.0" y="475" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#116329">Public shells + health</text>
<text x="340.0" y="497" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">GET /, /admin HTML and /settings HTML</text>
<text x="340.0" y="514" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">/v1/health and /v1/ready</text>
<text x="340.0" y="531" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">The underlying administrative APIs enforce authentication</text>
<rect x="696" y="164" width="840" height="88" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="1116.0" y="187" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328">Selection routes</text>
<text x="1116.0" y="209" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">Native tool calls when wired; regex intent fallback otherwise</text>
<text x="1116.0" y="226" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">Both routes enter the same executor and policy boundary</text>
<rect x="696" y="292" width="840" height="100" rx="10" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/>
<text x="1116.0" y="315" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#633c01">ToolExecutor + registered capabilities</text>
<text x="1116.0" y="337" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">tools_enabled=false: external tools off; internal skill tools remain (including writes)</text>
<text x="1116.0" y="354" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">tools_enabled=true: external tools are registered; native runner may be wired</text>
<text x="1116.0" y="371" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">Every selected tool must be registered and pass its execution policy</text>
<rect x="696" y="452" width="392" height="120" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<text x="892.0" y="475" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="15" font-weight="700" fill="#a40e26">Filesystem / external tools</text>
<text x="892.0" y="497" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">External capabilities require tools_enabled</text>
<text x="892.0" y="514" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">Filesystem paths stay in tools_workspace</text>
<text x="892.0" y="531" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">Out-of-workspace paths are refused</text>
<text x="892.0" y="548" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">Network tools have their own policies</text>
<rect x="1120" y="452" width="416" height="120" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<text x="1328.0" y="475" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="15" font-weight="700" fill="#a40e26">shell.run_command</text>
<text x="1328.0" y="497" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">Also requires shell_tool_enabled</text>
<text x="1328.0" y="514" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">Explicit opt-in; trusted callers only</text>
<text x="1328.0" y="531" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">Configured allowlist and shell policy apply</text>
<text x="1328.0" y="548" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">Shell remains off by default</text>
<rect x="40" y="620" width="1520" height="76" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="800.0" y="643" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Tracked starter defaults</text>
<text x="800.0" y="665" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">api_key='' · cors_origins=[] · tools_enabled=false · tools_workspace='' · shell_tool_enabled=false. Review deployment settings before exposing a host.</text></svg>