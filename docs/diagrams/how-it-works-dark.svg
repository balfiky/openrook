<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040" role="img" aria-labelledby="how-it-works-dark-title how-it-works-dark-desc"><title id="how-it-works-dark-title">How OpenRook carries state into the next conversation</title><desc id="how-it-works-dark-desc">Illustrative comparison: a plain LLM call receives no history of Monday; OpenRook saves state after a detected rupture and session consolidation, then supplies retrieved memories, relationship open loops, trust, current mood, and identity context to Friday’s prompt. Your LLM writes the reply; dialogue and state changes are examples, not a recorded run.</desc><style>
@media (prefers-reduced-motion: no-preference) {
  .how-step { animation: how-reveal 600ms ease-out both; }
  .how-state { animation-delay: 700ms; }
  .how-friday { animation-delay: 1400ms; }
}
@keyframes how-reveal { from { opacity: 0.25; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .how-step { animation: none; opacity: 1; }
}
@media print {
  .how-step { animation: none; opacity: 1; }
}</style><defs><linearGradient id="how-it-works-dark-howBody" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#FFD9A8"/><stop offset="0.38" stop-color="#F5A65B"/><stop offset="0.78" stop-color="#9A5A9E"/><stop offset="1" stop-color="#4A2E63"/></linearGradient><radialGradient id="how-it-works-dark-howLight" cx="50%" cy="55%" r="60%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.45" stop-color="#FFF1D6"/><stop offset="1" stop-color="#FFC27A"/></radialGradient><filter id="how-it-works-dark-howGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="how-it-works-dark-howClip"><path d="M20,8 H36 V17 H43 V8 H57 V17 H64 V8 H80 V34 L72,42 L70,86 L78,92 V98 L84,102 V112 H16 V102 L22,98 V92 L30,86 L28,42 L20,34 Z"/></clipPath><marker id="how-it-works-dark-how-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#A6B0BE"/></marker></defs><text x="56" y="68" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="normal" fill="#E6EDF3">The next conversation can start with a history.</text><text x="56" y="112" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="normal" fill="#A6B0BE">Same message on Friday. Different context behind the reply.</text><text x="64" y="164" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="normal" fill="#A6B0BE">MONDAY</text><text x="444" y="164" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="normal" fill="#A6B0BE">BETWEEN CONVERSATIONS</text><text x="936" y="164" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="normal" fill="#A6B0BE">FRIDAY</text><rect x="32" y="188" width="1536" height="268" rx="8" fill="#161B22" stroke="#3D444D"/><rect x="32" y="480" width="1536" height="412" rx="8" fill="#161B22" stroke="#3D444D"/><text x="64" y="230" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" fill="#E6EDF3">Plain LLM call</text><text x="308" y="230" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="normal" fill="#A6B0BE">no history supplied</text><text x="64" y="428" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="normal" fill="#A6B0BE">No supplied history, no memory of Monday.</text><text x="64" y="526" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" fill="#F5A65B">With OpenRook</text><text x="392" y="526" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="normal" fill="#A6B0BE">State persists and shapes the reply.</text><g class="how-step how-monday" data-step="1"><text x="64" y="278" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="normal" fill="#A6B0BE">YOU</text><text x="64" y="314" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="normal" fill="#E6EDF3">“You completely</text><text x="64" y="352" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="normal" fill="#E6EDF3">misunderstood me.”</text><text x="64" y="566" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="normal" fill="#A6B0BE">YOU</text><text x="64" y="602" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="normal" fill="#E6EDF3">“You completely</text><text x="64" y="640" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="normal" fill="#E6EDF3">misunderstood me.”</text><text x="64" y="694" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="normal" fill="#A6B0BE">Example: rupture detected</text><text x="64" y="724" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="normal" fill="#A6B0BE">State saved at session end</text></g><g class="how-step how-state" data-step="2"><path d="M392,324 H424" fill="none" stroke="#A6B0BE" stroke-width="2" marker-end="url(#how-it-works-dark-how-arrow)"/><text x="444" y="314" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="normal" fill="#A6B0BE">Nothing saved for this call</text><text x="444" y="352" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="normal" fill="#A6B0BE">Monday is absent from the prompt.</text><path d="M392,624 H424" fill="none" stroke="#A6B0BE" stroke-width="2" marker-end="url(#how-it-works-dark-how-arrow)"/><rect x="436" y="552" width="448" height="300" rx="8" fill="#21262D" stroke="#3D444D"/><g transform="translate(448.0 564.0) scale(0.5333)"><path d="M20,8 H36 V17 H43 V8 H57 V17 H64 V8 H80 V34 L72,42 L70,86 L78,92 V98 L84,102 V112 H16 V102 L22,98 V92 L30,86 L28,42 L20,34 Z" fill="url(#how-it-works-dark-howBody)"/><g clip-path="url(#how-it-works-dark-howClip)"><rect x="16.00" y="99" width="11.93" height="3.2" fill="#FF6B6B"/><rect x="27.33" y="99" width="11.93" height="3.2" fill="#F5A65B"/><rect x="38.67" y="99" width="11.93" height="3.2" fill="#5BC0EB"/><rect x="50.00" y="99" width="11.93" height="3.2" fill="#E86FB0"/><rect x="61.33" y="99" width="11.93" height="3.2" fill="#7BD389"/><rect x="72.67" y="99" width="11.93" height="3.2" fill="#B48CFF"/><rect x="0" y="34" width="100" height="2.2" fill="#FFFFFF" opacity="0.18"/></g><path d="M43.5,77 V58 A6.5,6.5 0 0 1 56.5,58 V77 Z" fill="#2A1E3F"/><path class="rook-window" d="M43.5,77 V58 A6.5,6.5 0 0 1 56.5,58 V77 Z" fill="url(#how-it-works-dark-howLight)" filter="url(#how-it-works-dark-howGlow)" transform="translate(50 67) scale(0.84) translate(-50 -67)"/></g><text x="520" y="588" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#E6EDF3">Persistent state</text><text x="520" y="620" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="normal" fill="#A6B0BE">After Monday’s session</text><rect x="460" y="644" width="216" height="40" rx="6" fill="#161B22" stroke="#3D444D"/><text x="476" y="671" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="normal" fill="#E6EDF3">memory written</text><rect x="692" y="644" width="168" height="40" rx="6" fill="#161B22" stroke="#3D444D"/><text x="708" y="671" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="normal" fill="#E6EDF3">trust ↓</text><rect x="460" y="700" width="400" height="64" rx="6" fill="#161B22" stroke="#3D444D"/><text x="476" y="725" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="normal" fill="#A6B0BE">Open loop:</text><text x="476" y="751" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="normal" fill="#E6EDF3">the misunderstanding</text><rect x="460" y="780" width="168" height="40" rx="6" fill="#161B22" stroke="#3D444D"/><text x="476" y="807" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="normal" fill="#E6EDF3">tension ↑</text><text x="648" y="807" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="normal" fill="#A6B0BE">Modeled state</text></g><g class="how-step how-friday" data-step="3"><path d="M892,324 H920" fill="none" stroke="#A6B0BE" stroke-width="2" marker-end="url(#how-it-works-dark-how-arrow)"/><text x="936" y="278" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="normal" fill="#A6B0BE">YOU</text><text x="936" y="314" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="normal" fill="#E6EDF3">“Can we try again?”</text><text x="936" y="358" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="normal" fill="#A6B0BE">LLM REPLY</text><text x="936" y="394" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="normal" fill="#E6EDF3">“Sure! What would you like</text><text x="936" y="432" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="normal" fill="#E6EDF3">to work on?”</text><text x="936" y="566" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="normal" fill="#A6B0BE">YOU</text><text x="936" y="602" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="normal" fill="#E6EDF3">“Can we try again?”</text><path d="M892,684 H920" fill="none" stroke="#A6B0BE" stroke-width="2" marker-end="url(#how-it-works-dark-how-arrow)"/><rect x="928" y="626" width="608" height="116" rx="8" fill="#21262D" stroke="#3D444D"/><text x="948" y="654" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#E6EDF3">Context carried into the prompt</text><text x="948" y="688" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="normal" fill="#E6EDF3">Retrieved memories · open loops · trust</text><text x="948" y="720" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="normal" fill="#E6EDF3">Current mood · identity</text><text x="936" y="780" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="normal" fill="#A6B0BE">LLM REPLY</text><text x="936" y="816" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="normal" fill="#E6EDF3">“Yes. Let’s revisit what</text><text x="936" y="854" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="normal" fill="#E6EDF3">I misunderstood last time.”</text></g><path d="M56,908 H1544" stroke="#3D444D" fill="none"/><text x="152" y="944" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="normal" fill="#E6EDF3">Your app → OpenRook (memory · relationships · mood · identity)</text><text x="152" y="980" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="normal" fill="#E6EDF3">→ supported LLM backends: Ollama · OpenAI-compatible · Codex</text><text x="152" y="1016" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="normal" fill="#A6B0BE">Illustrative example — OpenRook keeps the state; your LLM still writes the words.</text></svg>
