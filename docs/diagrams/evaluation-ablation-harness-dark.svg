<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="544" viewBox="0 0 1200 544" role="img" aria-labelledby="evaluation-ablation-harness-dark-title evaluation-ablation-harness-dark-desc">
<title id="evaluation-ablation-harness-dark-title">How structural evidence becomes a report</title>
<desc id="evaluation-ablation-harness-dark-desc">The ablation command runs fresh CognitivePipelines for scenarios, stamps provenance and outcome labels, and writes per-variant JSON and a combined summary; the historical checked-in reports use an evaluation-only mock backend.</desc>
