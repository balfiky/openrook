<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" width="1600" height="650" role="img" aria-labelledby="emotional-fingerprints-light-title emotional-fingerprints-light-desc"><title id="emotional-fingerprints-light-title">Four moments, four shapes of state</title><desc id="emotional-fingerprints-light-desc">Six-petal glyphs of the engine's modulator values at calm, warmth, rupture and repair.</desc><style></style><text x="60" y="70" font-family="'EB Garamond','Cormorant Garamond',Georgia,'DejaVu Serif',serif" font-size="40" fill="#1F1830">Four moments, four shapes of state</text><text x="62" y="110" font-family="'DejaVu Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#655C72">Each petal is one modulator's value at that moment of the same engine evaluation (authored events, illustrative dialogue).</text><g><circle cx="220" cy="290" r="74.0" fill="none" stroke="#655C72" stroke-opacity="0.18" stroke-dasharray="2 6"/><circle cx="220" cy="290" r="130.0" fill="none" stroke="#655C72" stroke-opacity="0.18" stroke-dasharray="2 6"/><path d="M220.0,290.0 Q238.0,249.3 220.0,216.0 Q202.0,249.3 220.0,290.0Z" fill="#C4474C" fill-opacity="0.78" stroke="#C4474C" stroke-width="1.5"/><path d="M220.0,290.0 Q264.2,285.2 284.1,253.0 Q246.2,254.1 220.0,290.0Z" fill="#A15B17" fill-opacity="0.78" stroke="#A15B17" stroke-width="1.5"/><path d="M220.0,290.0 Q246.2,325.9 284.1,327.0 Q264.2,294.8 220.0,290.0Z" fill="#167A9C" fill-opacity="0.78" stroke="#167A9C" stroke-width="1.5"/><path d="M220.0,290.0 Q202.0,330.7 220.0,364.0 Q238.0,330.7 220.0,290.0Z" fill="#B33D7C" fill-opacity="0.78" stroke="#B33D7C" stroke-width="1.5"/><path d="M220.0,290.0 Q145.1,303.2 107.4,355.0 Q171.1,348.3 220.0,290.0Z" fill="#327D45" fill-opacity="0.78" stroke="#327D45" stroke-width="1.5"/><path d="M220.0,290.0 Q216.4,276.4 204.4,281.0 Q206.4,293.7 220.0,290.0Z" fill="#7A4A8C" fill-opacity="0.78" stroke="#7A4A8C" stroke-width="1.5"/><circle cx="220" cy="290" r="9" fill="#E8913F"/>