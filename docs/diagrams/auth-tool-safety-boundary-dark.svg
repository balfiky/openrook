<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="848" viewBox="0 0 1280 848" role="img" aria-labelledby="auth-tool-safety-boundary-dark-title auth-tool-safety-boundary-dark-desc">
<title id="auth-tool-safety-boundary-dark-title">Two independent gates</title>
<desc id="auth-tool-safety-boundary-dark-desc">Configured HTTP bearer authentication and tool registration are independent: internal skill tools remain available, external tools require tools_enabled, shell also requires shell_tool_enabled, and native or regex selection uses the same executor policy.</desc>
