<text x="520.0" y="572" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="700" fill="#5931ad">shared/agent_runtime.db + replay records</text>
<text x="520.0" y="594" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">manifest · goals / revisions · actions / receipts · learning state · checkpoints</text>
<text x="520.0" y="610" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">Activation replay frames capture transitions and request/state evidence; replay checks have documented limits.</text>
<text x="520.0" y="626" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">Shared Life History and self-model stores retain identity context alongside the research records.</text>
<rect x="1032" y="532" width="528" height="120" rx="10" fill="#dafbe1" stroke="#2da44e" stroke-width="1.5"/>
<text x="1296.0" y="555" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" fill="#116329">Observer: read-only</text>
<text x="1296.0" y="577" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">Reads durable records without advancing the subject</text>
<text x="1296.0" y="594" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">Does not own the loop or mutate subject state</text>
<text x="1296.0" y="611" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">Budgets and stop limits apply across activations</text>
<text x="1296.0" y="628" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">See RESEARCH_RUNTIME.md for modes and replay limits</text></svg>