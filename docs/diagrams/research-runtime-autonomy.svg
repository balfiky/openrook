<text x="236.0" y="187" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#0550ae">1. Wake + restore context</text>
<text x="236.0" y="209" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">timer / registered wake condition</text>
<text x="236.0" y="226" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">resume only when budgets allow</text>
<text x="236.0" y="243" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">load observations, goals and state</text>
<rect x="456" y="164" width="344" height="104" rx="10" fill="#fff1e5" stroke="#fb8f44" stroke-width="1.5"/>
<text x="628.0" y="187" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#9a5700">2. Deliberate</text>
<text x="628.0" y="209" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">model selects activity or rest / wait</text>
<text x="628.0" y="226" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">use known records + destinations</text>
<text x="628.0" y="243" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">reflect / contact are also available</text>
<rect x="848" y="164" width="344" height="104" rx="10" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/>
<text x="1020.0" y="187" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#633c01">3. Select / revise a goal</text>
<text x="1020.0" y="209" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">persist criteria, dependencies, revision</text>
<text x="1020.0" y="226" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">retain continuation and wake condition</text>
<text x="1020.0" y="243" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">changed criteria require new evidence</text>
<rect x="1240" y="164" width="296" height="104" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<text x="1388.0" y="187" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#a40e26">4. Act through tools</text>
<text x="1388.0" y="209" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">registered executor + policy</text>
<text x="1388.0" y="226" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">bounded execution steps</text>
<text x="1388.0" y="243" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">may choose no action</text>
<rect x="1240" y="324" width="296" height="120" rx="10" fill="#eae6ff" stroke="#8250df" stroke-width="1.5"/>
<text x="1388.0" y="347" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#5931ad">5. Record receipts</text>
<text x="1388.0" y="369" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">action result / failure / unknown</text>
<text x="1388.0" y="386" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">goal and revision attribution</text>
<text x="1388.0" y="403" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">public feedback is evidence</text>
<text x="1388.0" y="420" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">invocation failure is not success</text>
<rect x="848" y="324" width="344" height="120" rx="10" fill="#ddf4ff" stroke="#218bff" stroke-width="1.5"/>
<text x="1020.0" y="347" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="15" font-weight="700" fill="#0550ae">6. Assess completion claims</text>
<text x="1020.0" y="369" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a">applicable verifier checks receipts</text>
<text x="1020.0" y="385" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a">supported / contradicted / unverified</text>
<text x="1020.0" y="401" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a">subjective criteria stay subjective</text>
<text x="1020.0" y="417" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a">assessment happens when completion is claimed</text>
<rect x="456" y="324" width="344" height="120" rx="10" fill="#ddf4ff" stroke="#218bff" stroke-width="1.5"/>
<text x="628.0" y="347" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#0550ae">7. Learn + appraise</text>
<text x="628.0" y="369" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">configured public-outcome learning</text>
<text x="628.0" y="386" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">grounded appraisal / attention</text>
<text x="628.0" y="403" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">updates future decision context</text>
<text x="628.0" y="420" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">no claim of experienced emotion</text>
<rect x="64" y="324" width="344" height="120" rx="10" fill="#eae6ff" stroke="#8250df" stroke-width="1.5"/>
<text x="236.0" y="347" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#5931ad">8. Checkpoint + rest</text>
<text x="236.0" y="369" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">persist subject + session state</text>
<text x="236.0" y="386" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">wait for a later wake or input</text>
<text x="236.0" y="403" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">budget exhaustion → resource wait</text>
<text x="236.0" y="420" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">study limit → resource stop</text>
<text x="64" y="476" text-anchor="start" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">Logical feedback flow: learning hooks run on public outcomes; verification is conditional on a completion claim, not a mandatory call after each action.</text>
