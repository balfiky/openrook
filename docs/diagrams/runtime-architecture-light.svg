<title id="runtime-architecture-light-title">One cognition core, several ways in</title>
<desc id="runtime-architecture-light-desc">Clients reach openrook or openrook-web, which share session management and cognition, a runtime LLM backend, policy-gated tools and durable stores; research mode adds one subject owner.</desc>
