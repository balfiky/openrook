<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" role="img" aria-labelledby="feature-overview-title feature-overview-desc" font-family="DejaVu Sans,Arial,sans-serif">
  <title id="feature-overview-title">OpenRook at a glance</title>
  <desc id="feature-overview-desc">Conversation channels connect to persistent cognitive state and policy-gated tools; the research loop is documented separately.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <radialGradient id="coreBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </radialGradient>
    <radialGradient id="brandMark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotgrid" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#1A1428" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="emotionFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="memoryFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3FB089"/>
      <stop offset="100%" stop-color="#2A8F6E"/>
    </linearGradient>
    <linearGradient id="identityFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9966AC"/>
      <stop offset="100%" stop-color="#7A4A8C"/>
    </linearGradient>
    <linearGradient id="evolutionFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="channelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D2A4A"/>
      <stop offset="100%" stop-color="#1A1428"/>
    </linearGradient>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="coreShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowhead" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#7A6A7A" fill-opacity="0.55"/>
    </marker>
    <style>
      .h1 { font-size: 34px; font-weight: 800; fill: #1A1428; letter-spacing: -0.025em; }
      .h2 { font-size: 14px; fill: #6E5E6E; }
      .section-num { font-size: 11px; font-weight: 800; fill: #4338CA; letter-spacing: 0.18em; }
      .section-label { font-size: 12px; font-weight: 700; fill: #1A1428; letter-spacing: 0.16em; }
      .section-detail { font-size: 11.5px; fill: #6E5E6E; }
      .channel-name { font-size: 16px; font-weight: 700; fill: #FFFFFF; letter-spacing: -0.01em; }
      .channel-detail { font-size: 11px; fill: #FFFFFF; opacity: 0.78; }
      .feature-name { font-size: 18px; font-weight: 800; fill: #FFFFFF; letter-spacing: -0.01em; }
      .feature-tag { font-size: 11.5px; font-weight: 600; fill: #1A1428; }
      .feature-line-bold { font-size: 12px; font-weight: 700; fill: #FFFFFF; }
      .feature-line { font-size: 11.5px; fill: #FFFFFF; opacity: 0.86; }
      .feature-foot { font-size: 10px; font-weight: 700; fill: #FFFFFF; opacity: 0.8; letter-spacing: 0.14em; }
      .cap-name { font-size: 15px; font-weight: 800; fill: #1A1428; letter-spacing: -0.01em; }
      .cap-detail { font-size: 11px; fill: #5A4A5A; }
      .cap-source { font-size: 10px; font-style: italic; fill: #8A7A8A; }
      .footer { font-size: 11px; font-weight: 600; fill: #6E5E6E; }
      .brandMarkText { font-size: 11px; font-weight: 800; fill: #1A1428; opacity: 0.10; letter-spacing: 0.18em; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1400" height="950" fill="url(#bg)"/>
  <!-- corner dot patterns for texture -->
  <rect x="0" y="0" width="240" height="240" fill="url(#dotgrid)"/>
  <rect x="1160" y="660" width="240" height="240" fill="url(#dotgrid)"/>
  <!-- decorative arcs -->
  <path d="M 0 460 Q 200 360, 0 260" fill="none" stroke="#6366F1" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M 1400 460 Q 1200 540, 1400 640" fill="none" stroke="#6366F1" stroke-opacity="0.12" stroke-width="2"/>

  <!-- ============ TITLE ============ -->
  <text x="700" y="60" text-anchor="middle" class="h1">OpenRook at a glance</text>
  <text x="700" y="84" text-anchor="middle" class="h2">Conversation channels, persistent state, and policy-gated tools. See the research diagram for background autonomy.</text>


  <!-- ============ 01 CHANNELS ============ -->
  <text x="100" y="140" class="section-num">01</text>
  <text x="138" y="140" class="section-label">CHANNELS</text>
  <text x="248" y="140" class="section-detail">how people reach OpenRook</text>
  <line x1="100" y1="152" x2="1300" y2="152" stroke="#1A1428" stroke-opacity="0.08" stroke-width="1"/>

  <!-- channel: Web UI -->
  <g filter="url(#cardShadow)">
    <rect x="100" y="172" width="290" height="86" rx="16" fill="url(#channelFill)"/>
  </g>
  <circle cx="142" cy="215" r="22" fill="#FFFFFF" fill-opacity="0.08"/>
  <g transform="translate(126,200)" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linejoin="round">
    <rect x="0" y="0" width="32" height="26" rx="4"/>
    <line x1="0" y1="8" x2="32" y2="8"/>
    <circle cx="5" cy="4" r="1.3" fill="#FFFFFF" stroke="none"/>
    <circle cx="10" cy="4" r="1.3" fill="#FFFFFF" stroke="none"/>
    <circle cx="15" cy="4" r="1.3" fill="#FFFFFF" stroke="none"/>
  </g>
  <text x="184" y="208" class="channel-name">Web UI</text>
  <text x="184" y="227" class="channel-detail">FastAPI · bundled chat shell</text>
  <text x="184" y="243" class="channel-detail">/settings workspace · /docs</text>

  <!-- channel: Telegram -->
  <g filter="url(#cardShadow)">
    <rect x="406" y="172" width="290" height="86" rx="16" fill="url(#channelFill)"/>
  </g>
  <circle cx="448" cy="215" r="22" fill="#FFFFFF" fill-opacity="0.08"/>
  <g transform="translate(432,200)" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 2 14 L 32 2 L 26 28 L 18 22 L 14 28 L 14 22 L 26 8 Z" fill="#FFFFFF" fill-opacity="0.95" stroke="none"/>
  </g>
  <text x="490" y="208" class="channel-name">Telegram</text>
  <text x="490" y="227" class="channel-detail">allowlist-gated bot</text>
  <text x="490" y="243" class="channel-detail">long-poll · per-user dedupe</text>

  <!-- channel: Console -->
  <g filter="url(#cardShadow)">
    <rect x="712" y="172" width="290" height="86" rx="16" fill="url(#channelFill)"/>
  </g>
  <circle cx="754" cy="215" r="22" fill="#FFFFFF" fill-opacity="0.08"/>
  <g transform="translate(738,200)" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <rect x="0" y="0" width="32" height="26" rx="4"/>
    <path d="M 6 9 L 11 13 L 6 17"/>
    <line x1="14" y1="17" x2="22" y2="17"/>
  </g>
  <text x="796" y="208" class="channel-name">Console</text>
  <text x="796" y="227" class="channel-detail">terminal runtime · debug</text>
  <text x="796" y="243" class="channel-detail">openrook · openrook-setup</text>

  <!-- channel: REST API -->
  <g filter="url(#cardShadow)">
    <rect x="1018" y="172" width="282" height="86" rx="16" fill="url(#channelFill)"/>
  </g>
  <circle cx="1060" cy="215" r="22" fill="#FFFFFF" fill-opacity="0.08"/>
  <g transform="translate(1044,200)" stroke="#FFFFFF" stroke-width="2" fill="none">
    <circle cx="16" cy="13" r="12"/>
    <line x1="4" y1="13" x2="28" y2="13"/>
    <ellipse cx="16" cy="13" rx="6" ry="12"/>
  </g>
  <text x="1102" y="208" class="channel-name">REST API</text>
  <text x="1102" y="227" class="channel-detail">/v1/chat · /v1/health</text>
  <text x="1102" y="243" class="channel-detail">bearer auth · per-user budgets</text>

  <!-- flow lines: channels → core -->
  <g stroke="#7A6A7A" stroke-opacity="0.45" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrowhead)">
    <path d="M 700 270 L 700 344"/>
  </g>

  <!-- ============ 02 COGNITIVE CORE ============ -->
  <text x="100" y="320" class="section-num">02</text>
  <text x="138" y="320" class="section-label">PERSISTENT COGNITIVE CORE</text>
  <text x="416" y="320" class="section-detail">state that survives every turn</text>
  <line x1="100" y1="332" x2="1300" y2="332" stroke="#1A1428" stroke-opacity="0.08" stroke-width="1"/>

  <!-- big core panel -->
  <g filter="url(#coreShadow)">
    <rect x="100" y="354" width="1200" height="290" rx="24" fill="url(#coreBg)" stroke="#1A1428" stroke-opacity="0.05"/>
  </g>
  <!-- Emotions card (top-left of core, but we'll do 4 in row) -->
  <g filter="url(#cardShadow)">
    <rect x="124" y="378" width="276" height="242" rx="18" fill="url(#emotionFill)"/>
  </g>
  <!-- icon circle -->
  <circle cx="158" cy="412" r="20" fill="#FFFFFF" fill-opacity="0.18"/>
  <g transform="translate(140,402)" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 12 L 7 12 L 11 4 L 17 22 L 22 10 L 28 16 L 36 12"/>
  </g>
  <text x="194" y="418" class="feature-name">Emotions</text>
  <text x="148" y="450" class="feature-line">Six modulators that shift on events</text>
  <text x="148" y="466" class="feature-line">and decay over time:</text>
  <g class="feature-tag">
    <rect x="148" y="480" width="68" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.92"/>
    <text x="182" y="495" text-anchor="middle">arousal</text>
    <rect x="222" y="480" width="68" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.92"/>
    <text x="256" y="495" text-anchor="middle">valence</text>
    <rect x="296" y="480" width="76" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.92"/>
    <text x="334" y="495" text-anchor="middle">certainty</text>
    <rect x="148" y="510" width="74" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.92"/>
    <text x="185" y="525" text-anchor="middle">bonding</text>
    <rect x="228" y="510" width="68" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.92"/>
    <text x="262" y="525" text-anchor="middle">energy</text>
    <rect x="302" y="510" width="80" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.92"/>
    <text x="342" y="525" text-anchor="middle">resolution</text>
  </g>
  <text x="148" y="558" class="feature-line">State informs appraisal and retrieval</text>
  <line x1="148" y1="572" x2="376" y2="572" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
  <text x="148" y="590" class="feature-foot">PER-SESSION JSON</text>
  <text x="148" y="608" class="feature-line">Restored on session resume</text>

  <!-- Memory card -->
  <g filter="url(#cardShadow)">
    <rect x="412" y="378" width="276" height="242" rx="18" fill="url(#memoryFill)"/>
  </g>
  <circle cx="446" cy="412" r="20" fill="#FFFFFF" fill-opacity="0.18"/>
  <g transform="translate(430,400)" stroke="#FFFFFF" stroke-width="2.4" fill="none">
    <ellipse cx="16" cy="6" rx="14" ry="4"/>
    <path d="M 2 6 L 2 14 C 2 16.2, 8.3 18, 16 18 C 23.7 18, 30 16.2, 30 14 L 30 6"/>
    <path d="M 2 14 L 2 22 C 2 24.2, 8.3 26, 16 26 C 23.7 26, 30 24.2, 30 22 L 30 14"/>
  </g>
  <text x="482" y="418" class="feature-name">Memory</text>
  <text x="436" y="450" class="feature-line">Five layers persisting relational and</text>
  <text x="436" y="466" class="feature-line">identity-level context:</text>
  <text x="436" y="488" class="feature-line-bold">Short-term <tspan font-weight="400" opacity="0.86">— turn-level, in-process</tspan></text>
  <text x="436" y="506" class="feature-line-bold">Long-term <tspan font-weight="400" opacity="0.86">— valence-weighted</tspan></text>
  <text x="436" y="524" class="feature-line-bold">Relationship arc <tspan font-weight="400" opacity="0.86">— rupture · repair</tspan></text>
  <text x="436" y="542" class="feature-line-bold">Semantic <tspan font-weight="400" opacity="0.86">— preferences · facts</tspan></text>
  <text x="436" y="560" class="feature-line-bold">Life History <tspan font-weight="400" opacity="0.86">— identity ledger</tspan></text>
  <line x1="436" y1="572" x2="664" y2="572" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
  <text x="436" y="590" class="feature-foot">SQLITE · INSPECTABLE</text>
  <text x="436" y="608" class="feature-line">data/&lt;user&gt;/nur.db + life_history.db</text>

  <!-- Identity card -->
  <g filter="url(#cardShadow)">
    <rect x="700" y="378" width="276" height="242" rx="18" fill="url(#identityFill)"/>
  </g>
  <circle cx="734" cy="412" r="20" fill="#FFFFFF" fill-opacity="0.18"/>
  <g transform="translate(720,400)" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linejoin="round">
    <path d="M 4 4 L 24 4 L 28 8 L 28 26 L 8 26 L 4 22 Z"/>
    <line x1="9" y1="11" x2="23" y2="11"/>
    <line x1="9" y1="17" x2="23" y2="17"/>
    <line x1="9" y1="23" x2="20" y2="23"/>
  </g>
  <text x="770" y="418" class="feature-name">Identity</text>
  <text x="724" y="450" class="feature-line">Who OpenRook is and is becoming:</text>
  <text x="724" y="476" class="feature-line-bold">Constitution <tspan font-weight="400" opacity="0.86">— operator-set</tspan></text>
  <text x="724" y="492" class="feature-line" style="opacity:0.86">orientation rendered above beliefs</text>
  <text x="724" y="514" class="feature-line-bold">Beliefs <tspan font-weight="400" opacity="0.86">— confidence-weighted,</tspan></text>
  <text x="724" y="530" class="feature-line" style="opacity:0.86">decay-prone, theme-promoted</text>
  <text x="724" y="552" class="feature-line-bold">Drives <tspan font-weight="400" opacity="0.86">— motivational drift</tspan></text>
  <line x1="724" y1="572" x2="952" y2="572" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
  <text x="724" y="590" class="feature-foot">SOUL SEEDS · LIFE HISTORY SHIFTS</text>
  <text x="724" y="608" class="feature-line">Inspectable in /settings → Life History</text>

  <!-- Evolution card -->
  <g filter="url(#cardShadow)">
    <rect x="988" y="378" width="288" height="242" rx="18" fill="url(#evolutionFill)"/>
  </g>
  <circle cx="1022" cy="412" r="20" fill="#FFFFFF" fill-opacity="0.18"/>
  <g transform="translate(1006,398)" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 16 28 L 16 14"/>
    <path d="M 16 18 C 10 18, 4 14, 4 8 C 10 8, 16 12, 16 18 Z" fill="#FFFFFF" fill-opacity="0.95"/>
    <path d="M 16 14 C 22 14, 28 10, 28 4 C 22 4, 16 8, 16 14 Z" fill="#FFFFFF" fill-opacity="0.95"/>
  </g>
  <text x="1058" y="418" class="feature-name">Evolution</text>
  <text x="1012" y="450" class="feature-line">Identity updates and skill loading:</text>
  <text x="1012" y="476" class="feature-line-bold">Metabolism <tspan font-weight="400" opacity="0.86">— decay,</tspan></text>
  <text x="1012" y="492" class="feature-line" style="opacity:0.86">theme→belief promotion</text>
  <text x="1012" y="514" class="feature-line-bold">Open questions <tspan font-weight="400" opacity="0.86">— gaps</tspan></text>
  <text x="1012" y="530" class="feature-line" style="opacity:0.86">surfaced for review</text>
  <text x="1012" y="552" class="feature-line-bold">Skills <tspan font-weight="400" opacity="0.86">— optional trigger filters</tspan></text>
  <line x1="1012" y1="572" x2="1252" y2="572" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
  <text x="1012" y="590" class="feature-foot">TUNABLE FROM /SETTINGS</text>
  <text x="1012" y="608" class="feature-line">Metabolism on session open / research tick</text>

  <!-- flow lines: core → capabilities -->
  <g stroke="#7A6A7A" stroke-opacity="0.45" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrowhead)">
    <path d="M 700 654 L 700 726"/>
  </g>

  <!-- ============ 03 CAPABILITIES ============ -->
  <text x="100" y="704" class="section-num">03</text>
  <text x="138" y="704" class="section-label">CAPABILITIES</text>
  <text x="266" y="704" class="section-detail">gated by intent &amp; autonomy level</text>
  <line x1="100" y1="716" x2="1300" y2="716" stroke="#1A1428" stroke-opacity="0.08" stroke-width="1"/>

  <rect x="100" y="736" width="285" height="142" rx="14" fill="#FFFFFF" stroke="#2A8F6E" stroke-width="1.6"/>
  <text x="120" y="765" class="cap-name">Skills</text>
  <text x="120" y="790" class="cap-detail">Paste, file, or zip import</text>
  <text x="120" y="808" class="cap-detail">applies_when filters declared triggers;</text>
  <text x="120" y="826" class="cap-detail">enabled skills without it stay loaded.</text>
  <text x="120" y="857" class="cap-source">runtime/skills.py</text>
  <rect x="405" y="736" width="285" height="142" rx="14" fill="#FFFFFF" stroke="#2A8F6E" stroke-width="1.6"/>
  <text x="425" y="765" class="cap-name">Web search</text>
  <text x="425" y="790" class="cap-detail">Read-only web provider</text>
  <text x="425" y="808" class="cap-detail">Native tool selection or regex fallback</text>
  <text x="425" y="826" class="cap-detail">shares the executor and policy checks.</text>
  <text x="425" y="857" class="cap-source">nur_tools/builtin/web_provider.py</text>
  <rect x="710" y="736" width="285" height="142" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="730" y="765" class="cap-name">File ops</text>
  <text x="730" y="790" class="cap-detail">Workspace-scoped filesystem</text>
  <text x="730" y="808" class="cap-detail">Writes depend on autonomy policy</text>
  <text x="730" y="826" class="cap-detail">and explicit intent checks.</text>
  <text x="730" y="857" class="cap-source">nur_tools/builtin/filesystem.py</text>
  <rect x="1015" y="736" width="285" height="142" rx="14" fill="#FFFFFF" stroke="#1A1428" stroke-width="1.6"/>
  <text x="1035" y="765" class="cap-name">Shell</text>
  <text x="1035" y="790" class="cap-detail">Separate opt-in flag</text>
  <text x="1035" y="808" class="cap-detail">Optional command allowlist</text>
  <text x="1035" y="826" class="cap-detail">System facts do not require shell.</text>
  <text x="1035" y="857" class="cap-source">nur_tools/builtin/shell.py</text>

  <!-- footer note -->
  <text x="700" y="918" text-anchor="middle" class="footer">Inspect state in /settings and authenticated admin APIs · OpenAPI at /docs</text>

</svg>
