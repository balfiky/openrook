<text x="1312.0" y="173" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a">You: Fixed it, feeling better.</text>
<text x="1312.0" y="191" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a">OpenRook: Good. Want to unpack what broke?</text>
<text x="1312.0" y="209" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a"></text>
