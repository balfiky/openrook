<text x="800.0" y="173" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a">You: Rollback was rough.</text>
<text x="800.0" y="191" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a">OpenRook: Monday went well. What changed?</text>
<text x="800.0" y="209" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a"></text>
<text x="800.0" y="227" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a">retrieves Mon · opens loop</text>
