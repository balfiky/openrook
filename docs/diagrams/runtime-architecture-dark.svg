<title id="runtime-architecture-dark-title">One cognition core, several ways in</title>
<desc id="runtime-architecture-dark-desc">Clients reach openrook or openrook-web, which share session management and cognition, a runtime LLM backend, policy-gated tools and durable stores; research mode adds one subject owner.</desc>
