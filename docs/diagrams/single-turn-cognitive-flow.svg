<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="648" viewBox="0 0 1600 648" role="img" aria-labelledby="single-turn-cognitive-flow-title single-turn-cognitive-flow-desc"><title id="single-turn-cognitive-flow-title">Single-Turn Cognitive Flow</title><desc id="single-turn-cognitive-flow-desc">Conversation-mode path. LLM cost depends on appraisal, deliberation, tools, checking, and retries; there is no fixed aggregate ceiling.</desc><defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L9,5 L1,9 Z" fill="#57606a"/></marker></defs><rect width="100%" height="100%" fill="#fafbfc"/><text x="48" y="52" text-anchor="start" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="28" font-weight="800" fill="#1f2328">Single-Turn Cognitive Flow</text><text x="48" y="78" text-anchor="start" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="400" fill="#57606a">Conversation-mode path. LLM cost depends on appraisal, deliberation, tools, checking, and retries; there is no fixed aggregate ceiling.</text><path d="M328,272 L356,272" fill="none" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrowhead)"/>
