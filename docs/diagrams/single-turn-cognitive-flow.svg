<text x="1408.0" y="159" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2328">5. Per-turn updates</text>
<text x="1408.0" y="181" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">Memory and relationship writes</text>
<text x="1408.0" y="198" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">trust / bonding / maturity deltas</text>
<text x="1408.0" y="215" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a"></text>
<text x="1408.0" y="232" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">Drain energy</text>
<text x="1408.0" y="249" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">per-message and spike drain</text>
<text x="1408.0" y="266" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a"></text>
<text x="1408.0" y="283" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">Assemble DebugState</text>
<text x="1408.0" y="300" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">modulators, dialogue, defense,</text>
<text x="1408.0" y="317" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">unresolved items and memories</text>
<text x="1408.0" y="334" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a"></text>
<text x="1408.0" y="351" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">Return response + debug state</text>
<text x="1408.0" y="368" text-anchor="middle" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a">to the calling channel</text>
